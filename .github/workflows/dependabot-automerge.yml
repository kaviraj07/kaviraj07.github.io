name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # main has no branch protection, so GitHub's auto-merge can't be enabled
      # and `gh pr merge --auto` fails whenever mergeability is still being
      # computed (e.g. several PRs opened at once). Wait for it, then merge
      # directly. A PR left conflicting by an earlier merge is rebased by
      # Dependabot, which re-runs this workflow.
      - name: Merge (no majors)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          for _ in $(seq 1 24); do
            state=$(gh pr view "$PR_URL" --json mergeable -q .mergeable)
            [ "$state" != "UNKNOWN" ] && break
            sleep 5
          done
          gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}